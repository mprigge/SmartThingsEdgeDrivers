name: evalogik-dimmer
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: switchLevel
    version: 1
    config:
      values:
        - key: "level.value"
          range: [1, 100]
  - id: refresh
    version: 1
  categories:
  - name: Switch
preferences:
  - name: "locatorLedStatus"
    title: "Locator LED Status"
    description: "LED indicator mode (default: Locator Mode). Status Mode = Load on, LED on; Locator Mode = Load off, LED on."
    preferenceType: enumeration
    definition:
      options:
        0: "Locator Mode"
        1: "Status Mode"
        2: "LED Always Off"
        3: "LED Always On"
      default: 0
  - name: "autoOffTimer"
    title: "Auto Off Timer"
    description: "Set the time in minutes for the switch to automatically turn off after being turned on (default: 0). Set to 0 to disable."
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 65535
      default: 0
  - name: "autoOnTimer"
    title: "Auto On Timer"
    description: "Set the time in minutes for the switch to automatically turn on after being turned off (default: 0). Set to 0 to disable."
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 65535
      default: 0
  - name: "powerRestoreState"
    title: "Power Restore State"
    description: "State after power restoration (default: Previous State)"
    preferenceType: enumeration
    definition:
      options:
        0: "Output Off"
        1: "Output On"
        2: "Previous State"
      default: 2
  - name: "localDimmingSpeed"
    title: "Local Dimming Speed"
    description: "Set the time in seconds to adjust from off to selected brightness when pressing the switch (default: 1s)."
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 10
      default: 1
  - name: "minimumDimming"
    title: "Minimum Dimming"
    description: "Set the minimum dimming percentage (default: 10%). Set to 0 to disable."
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 99
      default: 10
  - name: "maximumDimming"
    title: "Maximum Dimming"
    description: "Set the maximum dimming percentage (default: 99%). Set to 0 to disable."
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 99
      default: 99
  - name: "dimmerSpeedControl"
    title: "Dimmer Speed Control"
    description: "Set whether to dim when changing power state or to change state instantly (default: Use Dimming Speed)."
    preferenceType: enumeration
    definition:
      options:
        0: "Use Dimming Speed"
        1: "On/Off Instantly"
      default: 0
  - name: "dimmingSpeed"
    title: "Dimming Speed"
    description: "Set the time in seconds to adjust from minimum brightness to maximum brightness when holding the button (default: 4s)."
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 10
      default: 4